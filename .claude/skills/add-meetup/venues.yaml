# Canonical venues for the add-meetup skill (see step 1c in SKILL.md).
# Query it with: uv run --with pyyaml .claude/skills/add-meetup/venue_lookup.py "<name or address>"
#
# `name` and `address` are copied verbatim into an event's `location:` block.
#
# Canonical form of `address`: "<street>, <City>" — street first, city always last, no
# postcode (Grenoble has both 38000 and 38100 and the same street shows up with each).
# There is no separate `city` field: the full line goes to the JSON-LD as `streetAddress`.
# `aliases` are for names the lookup cannot reach on its own. Case, accents, punctuation,
# a leading "Le/La" and a shortened name ("Casemate" for "La Casemate") are already handled
# by the lookup, so don't list them.
#
# One street address can host several venues (Minimistan / Cowork In Grenoble,
# SII / Wizbii): the lookup returns all of them and the user picks. Keep the entries apart.
# Add any new venue here when creating an event.

