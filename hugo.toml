baseURL = "https://grenoble-meetups.fr"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Grenoble Tech Meetups"
enableRobotsTXT = true
enableGitInfo = true
buildFuture = true

# Les fichiers d'événement nomment leur date `startDate`, pour former une paire
# symétrique avec `endDate` (et correspondre au vocabulaire schema.org que ces
# champs alimentent). Hugo peuple `.Date` depuis le premier champ trouvé dans
# cette liste, donc `.Date` continue de fonctionner partout sans changement de
# template. `date` reste dans la liste : c'est la clé des `_index.md` de mois,
# où la date est un marqueur de mois et non le début d'un intervalle.
[frontmatter]
  date = ["startDate", "date", "publishDate", "lastmod"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[taxonomies]
  group = "groups"

[mediaTypes]
  [mediaTypes.'text/calendar']
    suffixes = ['ics']

[outputFormats]
  [outputFormats.CALENDAR]
    mediaType = 'text/calendar'
    baseName = 'meetups'
    isPlainText = true
    noUgly = true

[outputs]
  home = ['HTML', 'RSS', 'CALENDAR']

[params]
  description = "Retrouvez tous les meetups tech de Grenoble : développement, IA, jeux vidéo, sécurité, python, data, product, et plus encore."
  # Accroche des cards sociales (voir layouts/partials/og-image.html). Distincte
  # de `description` : une seule ligne doit tenir sur l'image, là où la méta
  # description peut être longue.
  ogTagline = "Développement, IA, data, sécurité, jeux vidéo, product…"
